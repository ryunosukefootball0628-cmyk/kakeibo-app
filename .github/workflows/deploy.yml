name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# 権限は各ジョブで必要なものだけを与える
permissions: {}

# 外部の Action は、タグの付け替えで中身を差し替えられないようコミット SHA で固定する
# (.github/dependabot.yml の設定で Dependabot が更新の PR を出す)
jobs:
  # アプリ本体は Firebase Hosting で配信する (ログインの中継ページと同じドメインにするため)。
  # firebase.json に書いた全サイト (現在のアドレスと、転送用の以前のアドレス) へ同じものを公開する
  firebase-hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # 依存パッケージのインストールスクリプトは .npmrc の ignore-scripts で実行しない
      - run: npm ci
      # Firebase の Web 設定はリポジトリの Settings > Secrets and variables > Actions >
      # Variables に登録する (公開値なので Secrets ではなく Variables)。
      # デプロイ用のサービスアカウントは `firebase init hosting:github` が Secrets に登録する
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAKEIBO_APP_EA14F != '' }}
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::リポジトリの Variables に ${name#VITE_} が登録されていません"
              exit 1
            fi
          done
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ]; then
            echo "::error::Secrets に FIREBASE_SERVICE_ACCOUNT_KAKEIBO_APP_EA14F がありません。README の手順で firebase init hosting:github を実行してください"
            exit 1
          fi
          npm run build
      # サービスアカウントの鍵を渡すので、中で使う firebase-tools の版も固定する (既定は latest)
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAKEIBO_APP_EA14F }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          firebaseToolsVersion: 15.34.0

  # 以前の配信先 (GitHub Pages) には移転案内を置く。移転先の公開が済んでから切り替える
  moved-notice:
    needs: firebase-hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fill in the new address
        env:
          APP_URL: https://${{ vars.FIREBASE_AUTH_DOMAIN }}/
        run: sed -i "s#__APP_URL__#${APP_URL}#g" moved/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
