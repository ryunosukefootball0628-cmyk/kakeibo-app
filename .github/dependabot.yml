# 依存パッケージと GitHub Actions の更新を PR で知らせる。
# 公開直後の版は乗っ取りに気づかれる前のことがあるため、7 日待ってから提案させる
# (リポジトリの設定で Dependabot security updates を有効にすると、脆弱性の修正は待たずに届く)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
